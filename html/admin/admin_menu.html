                                    </div>
                                    <div class="col-1">
                                    </div>
                                </div>
                                <div class="row cl">
                                    <label class="form-label col-xs-3 col-sm-2">是否最终节点：</label>
                                    <div class="formControls col-xs-8 col-sm-9 skin-minimal">
                                        <div class="radio-box">
                                            <input type="radio" id="is_leaf_1" name="is_leaf" value="false">否
                                        </div>
                                        <div class="radio-box">
                                            <input type="radio" id="is_leaf_2" name="is_leaf" value="true">是
                                        </div>
                                    </div>
                                    <div class="col-1">
                                    </div>
                                </div>
                                <div class="row cl">
                                    <label class="form-label col-xs-3 col-sm-2">是否显示：</label>
                                    <div class="formControls col-xs-8 col-sm-9 skin-minimal">
                                        <div class="radio-box">
                                            <input type="radio" id="is_show_1" name="is_show" value="false">否
                                        </div>
                                        <div class="radio-box">
                                            <input type="radio" id="is_show_2" name="is_show" value="true">是
                                        </div>
                                    </div>
                                    <div class="col-1">
                                    </div>
                                </div>
                                <div class="row cl">
                                    <label class="form-label col-xs-3 col-sm-2">是否启用：</label>
                                    <div class="formControls col-xs-8 col-sm-9 skin-minimal">
                                        <div class="radio-box">
                                            <input type="radio" id="is_enabled_1" name="is_enabled" value="false">否
                                        </div>
                                        <div class="radio-box">
                                            <input type="radio" id="is_enabled_2" name="is_enabled" value="true">是
                                        </div>
                                    </div>
                                    <div class="col-1">
                                    </div>
                                </div>
                            </div>
                            <div class="row cl">
                                <div class="col-9 col-offset-3">
                                    <button onClick="save_submit();" class="btn btn-primary radius" type="button">
                                        &nbsp;&nbsp;提交&nbsp;&nbsp;
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 模态框底部 -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">取消</button>
                    <button type="button" onClick="save();" class="btn btn-primary radius">提交</button>
                </div>

            </div>
        </div>

        /*编辑*/
        function edit(title) {
            document.querySelector('.modal-title').textContent = title
            var arrselections = document.querySelector("#list").bootstrapTable('getSelections');

            if (arrselections.length > 1) {
                alert("只能选择一行进行编辑");
                return;
            }
            if (arrselections.length <= 0) {
                alert("请选择一行进行编辑");
                return;
            }
            var id = arrselections[0].id;
            alert('选择' + id)
            document.querySelector("#myModal").show()
            save(id)
        }

        function save(url, id) {
            if (id) {
                url = url + id + "/"
            }
            $.ajax({
                type: 'POST',
                url: url,
                data: $("#form").serialize(),
                dataType: 'json',
                success: function (data) {
                    if (checkLogin(data, true)) {
                        layer.msg('保存成功!', { icon: 1, time: 3000 });
